name: Build ML Ready Racing Dataset

on:
  workflow_dispatch:

  push:
    paths:
      - "scripts/build_hkjc_ml_features.py"
      - "results/races/all_results.csv"
      - "results/races/all_results_with_races_removed.csv"
      - ".github/workflows/build-ml-ready.yml"

permissions:
  contents: write

jobs:
  build-ml-ready:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy

      - name: Check required files exist
        run: |
          test -f scripts/build_hkjc_ml_features.py || {
            echo "ERROR: scripts/build_hkjc_ml_features.py not found"
            exit 1
          }

          test -f results/races/all_results.csv || {
            echo "ERROR: results/races/all_results.csv not found"
            exit 1
          }

          test -f results/races/all_results_with_races_removed.csv || {
            echo "ERROR: results/races/all_results_with_races_removed.csv not found"
            exit 1
          }

          echo "All required files found."

      - name: Build ML ready dataset
        run: |
          python scripts/build_hkjc_ml_features.py \
            --input results/races/all_results_with_races_removed.csv \
            --history-input results/races/all_results.csv \
            --output results/races/all_results_ML_ready.csv

      - name: Show output details
        run: |
          echo "Generated files:"
          ls -lh results/races/all_results_ML_ready.csv*
          
          echo
          echo "CSV header column count:"
          python - <<'PY'
          import pandas as pd

          path = "results/races/all_results_ML_ready.csv"
          df = pd.read_csv(path, nrows=5)

          print(f"Columns: {len(df.columns)}")
          print("First 20 columns:")
          for col in df.columns[:20]:
              print(f" - {col}")
          PY

      - name: Ensure ML output is not tracked by Git LFS
        run: |
          ATTRIBUTE="$(git check-attr filter -- results/races/all_results_ML_ready.csv | awk '{print $3}')"

          if [ "$ATTRIBUTE" = "lfs" ]; then
            echo "ERROR:"
            echo "results/races/all_results_ML_ready.csv"
            echo "is currently configured for Git LFS."
            echo
            echo "Remove its Git LFS rule from .gitattributes."
            exit 1
          fi

          echo "Confirmed:"
          echo "ML ready CSV will be stored as a normal Git file."

      - name: Commit generated ML dataset
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add results/races/all_results_ML_ready.csv

          if [ -f results/races/all_results_ML_ready.csv.features.json ]; then
            git add results/races/all_results_ML_ready.csv.features.json
          fi

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "Build ML-ready racing dataset"
          git push
