name: Build ML Ready Racing Dataset

on:
  workflow_dispatch:

  push:
    paths:
      - "scripts/build_hkjc_ml_features.py"
      - "results/races/all_results.csv"
      - "results/races/all_results_with_races_removed.csv"
      - ".github/workflows/build-ml-ready.yml"

permissions:
  contents: write

jobs:
  build-ml-ready:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy

      - name: Check required files exist
        run: |
          test -f scripts/build_hkjc_ml_features.py || {
            echo "ERROR: scripts/build_hkjc_ml_features.py not found"
            exit 1
          }

          test -f results/races/all_results.csv || {
            echo "ERROR: results/races/all_results.csv not found"
            exit 1
          }

          test -f results/races/all_results_with_races_removed.csv || {
            echo "ERROR: results/races/all_results_with_races_removed.csv not found"
            exit 1
          }

          echo "All required files found."

      - name: Build ML ready dataset
        run: |
          python scripts/build_hkjc_ml_features.py \
            --history results/races/all_results.csv \
            --rows results/races/all_results_with_races_removed.csv \
            --output results/races/all_results_ML_ready.csv

      - name: Validate output
        run: |
          test -f results/races/all_results_ML_ready.csv || {
            echo "ERROR: ML-ready CSV was not created."
            exit 1
          }

          python - <<'PY'
          import pandas as pd

          path = "results/races/all_results_ML_ready.csv"

          df = pd.read_csv(path, low_memory=False)

          print(f"Rows: {len(df):,}")
          print(f"Columns: {len(df.columns):,}")

          if "is_winner" not in df.columns:
              raise SystemExit("ERROR: is_winner target is missing")

          if "race_id" not in df.columns:
              raise SystemExit("ERROR: race_id is missing")

          if df["result_id"].duplicated().any():
              raise SystemExit("ERROR: duplicate result_id values detected")

          print()
          print("Target distribution:")
          print(df["is_winner"].value_counts(dropna=False))

          print()
          print("Validation passed.")
          PY

      - name: Show generated files
        run: |
          echo "Generated ML files:"
          ls -lh results/races/all_results_ML_ready.csv*

      - name: Ensure output is not Git LFS
        run: |
          ATTRIBUTE="$(git check-attr filter -- results/races/all_results_ML_ready.csv | awk '{print $3}')"

          if [ "$ATTRIBUTE" = "lfs" ]; then
            echo "ERROR:"
            echo "results/races/all_results_ML_ready.csv"
            echo "is currently configured for Git LFS."
            echo
            echo "Remove its Git LFS rule from .gitattributes."
            exit 1
          fi

          echo "Confirmed:"
          echo "ML-ready CSV will be stored as a normal Git file."

      - name: Commit generated ML dataset
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add results/races/all_results_ML_ready.csv

          if [ -f results/races/all_results_ML_ready.csv.features.json ]; then
            git add results/races/all_results_ML_ready.csv.features.json
          fi

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "Build ML-ready racing dataset"
          git push
