name: Clean historical race results

on:
  workflow_dispatch:

  push:
    paths:
      - "scripts/clean.py"
      - ".github/workflows/clean-historical-race-results.yml"

permissions:
  contents: write

concurrency:
  group: clean-historical-race-results
  cancel-in-progress: false

jobs:
  clean-results:
    runs-on: ubuntu-latest

    steps:
      # ======================================================
      # CHECKOUT REPOSITORY INCLUDING GIT LFS FILES
      # ======================================================

      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          lfs: true
          fetch-depth: 0

      # ======================================================
      # ENSURE GIT LFS CONTENT IS DOWNLOADED
      # ======================================================

      - name: Pull Git LFS files
        shell: bash
        run: |
          set -euo pipefail

          git lfs install
          git lfs pull

      # ======================================================
      # VERIFY REQUIRED FILES EXIST
      # ======================================================

      - name: Verify required files
        shell: bash
        run: |
          set -euo pipefail

          test -f results/races/all_results_cleaned.csv
          test -f scripts/clean.py

          echo "Cleaned results file:"
          ls -lh results/races/all_results_cleaned.csv

          echo
          echo "Cleaning script:"
          ls -lh scripts/clean.py

      # ======================================================
      # VERIFY CLEANED CSV IS TRACKED BY GIT LFS
      # ======================================================

      - name: Verify Git LFS tracking
        shell: bash
        run: |
          set -euo pipefail

          ATTRIBUTE="$(
            git check-attr filter -- results/races/all_results_cleaned.csv |
            awk '{print $3}'
          )"

          if [ "$ATTRIBUTE" != "lfs" ]; then
            echo "ERROR:"
            echo "results/races/all_results_cleaned.csv is not tracked by Git LFS."
            exit 1
          fi

          echo "Git LFS tracking confirmed."

          echo
          git lfs ls-files

      # ======================================================
      # VERIFY THE REAL CSV WAS DOWNLOADED
      # ======================================================

      - name: Verify LFS content
        shell: bash
        run: |
          set -euo pipefail

          if head -n 1 results/races/all_results_cleaned.csv |
             grep -q '^version https://git-lfs.github.com/spec/v1'; then

            echo "ERROR:"
            echo "results/races/all_results_cleaned.csv is still an LFS pointer."
            exit 1
          fi

          echo "Confirmed real CSV content is present."

      # ======================================================
      # SET UP PYTHON
      # ======================================================

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # ======================================================
      # INSTALL DEPENDENCIES
      # ======================================================

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail

          python -m pip install --upgrade pip
          python -m pip install "pandas>=2.2,<3" "numpy>=1.26,<3"

      # ======================================================
      # RUN CLEANING SCRIPT
      #
      # clean.py must read and overwrite:
      #
      # results/races/all_results_cleaned.csv
      # ======================================================

      - name: Clean historical race results
        shell: bash
        run: |
          set -euo pipefail

          python scripts/clean.py

      # ======================================================
      # VERIFY OUTPUT STILL EXISTS AND IS A REAL CSV
      # ======================================================

      - name: Verify cleaned output
        shell: bash
        run: |
          set -euo pipefail

          test -f results/races/all_results_cleaned.csv

          if head -n 1 results/races/all_results_cleaned.csv |
             grep -q '^version https://git-lfs.github.com/spec/v1'; then

            echo "ERROR:"
            echo "The output file is an LFS pointer instead of CSV content."
            exit 1
          fi

          echo "Updated cleaned CSV:"
          ls -lh results/races/all_results_cleaned.csv

      # ======================================================
      # VERIFY ORIGINAL RAW RESULTS WERE NOT MODIFIED
      # ======================================================

      - name: Confirm original results file was not modified
        shell: bash
        run: |
          set -euo pipefail

          if ! git diff --quiet -- results/races/all_results.csv; then
            echo "ERROR:"
            echo "results/races/all_results.csv was modified."
            exit 1
          fi

          echo "Confirmed:"
          echo "results/races/all_results.csv was not modified."

      # ======================================================
      # VERIFY ONLY THE CLEANED CSV CHANGED
      # ======================================================

      - name: Verify only cleaned CSV changed
        shell: bash
        run: |
          set -euo pipefail

          CHANGED_FILES="$(
            {
              git diff --name-only
              git ls-files --others --exclude-standard
            } |
            sort -u
          )"

          UNEXPECTED_FILES="$(
            printf '%s\n' "$CHANGED_FILES" |
            grep -v '^results/races/all_results_cleaned\.csv$' ||
            true
          )"

          if [ -n "$UNEXPECTED_FILES" ]; then
            echo "ERROR:"
            echo "Unexpected files were modified or created:"
            echo "$UNEXPECTED_FILES"
            exit 1
          fi

          echo "Only the expected cleaned CSV was modified."

      # ======================================================
      # DISPLAY RESULT
      # ======================================================

      - name: Show result
        shell: bash
        run: |
          set -euo pipefail

          echo "Updated file:"
          ls -lh results/races/all_results_cleaned.csv

          echo
          echo "Git status:"
          git status --short

      # ======================================================
      # STAGE UPDATED LFS FILE
      # ======================================================

      - name: Stage cleaned results
        shell: bash
        run: |
          set -euo pipefail

          git add results/races/all_results_cleaned.csv

          echo "Staged files:"
          git diff --cached --name-only

      # ======================================================
      # VERIFY STAGED FILE REMAINS LFS TRACKED
      # ======================================================

      - name: Verify staged LFS file
        shell: bash
        run: |
          set -euo pipefail

          ATTRIBUTE="$(
            git check-attr filter -- results/races/all_results_cleaned.csv |
            awk '{print $3}'
          )"

          if [ "$ATTRIBUTE" != "lfs" ]; then
            echo "ERROR:"
            echo "Updated CSV is no longer tracked by Git LFS."
            exit 1
          fi

          echo "Updated CSV remains tracked by Git LFS."

      # ======================================================
      # COMMIT AND PUSH UPDATED CLEANED CSV
      # ======================================================

      - name: Commit cleaned results
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git diff --cached --quiet; then
            echo "No changes detected."
            echo "Nothing to commit."
            exit 0
          fi

          git commit -m "Update cleaned historical HKJC results"
          git push
