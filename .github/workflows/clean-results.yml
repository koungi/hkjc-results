name: Correct historical prize money

on:
  workflow_dispatch:

  push:
    paths:
      - "scripts/clean.py"

permissions:
  contents: write

concurrency:
  group: correct-historical-prize-money
  cancel-in-progress: false

jobs:
  correct-prize-money:
    runs-on: ubuntu-latest

    steps:
      # ======================================================
      # CHECKOUT REPOSITORY INCLUDING GIT LFS FILES
      # ======================================================

      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          lfs: true
          fetch-depth: 0

      # ======================================================
      # DOWNLOAD GIT LFS CONTENT
      # ======================================================

      - name: Pull Git LFS files
        shell: bash
        run: |
          git lfs install
          git lfs pull

      # ======================================================
      # VERIFY CLEANED CSV AND PYTHON SCRIPT EXIST
      # ======================================================

      - name: Verify input files
        shell: bash
        run: |
          test -f results/races/all_results_cleaned.csv
          test -f scripts/clean.py

          echo "CSV:"
          ls -lh results/races/all_results_cleaned.csv

          echo
          echo "Python script:"
          ls -lh scripts/clean.py

      # ======================================================
      # VERIFY CLEANED CSV IS TRACKED BY GIT LFS
      # ======================================================

      - name: Verify Git LFS tracking
        shell: bash
        run: |
          ATTRIBUTE="$(git check-attr filter -- results/races/all_results_cleaned.csv | awk '{print $3}')"

          if [ "$ATTRIBUTE" != "lfs" ]; then
            echo "ERROR:"
            echo "results/races/all_results_cleaned.csv is not tracked by Git LFS."
            exit 1
          fi

          echo "Git LFS tracking confirmed."

      # ======================================================
      # SET UP PYTHON
      # ======================================================

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # ======================================================
      # INSTALL DEPENDENCIES
      # ======================================================

      - name: Install dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install "pandas>=2.2,<3"

      # ======================================================
      # RUN CLEANING / PRIZE-MONEY CORRECTION
      #
      # scripts/clean.py reads:
      # results/races/all_results_cleaned.csv
      #
      # and saves the result back to:
      # results/races/all_results_cleaned.csv
      # ======================================================

      - name: Correct historical prize money
        shell: bash
        run: |
          python scripts/clean.py

      # ======================================================
      # VERIFY OUTPUT FILE STILL EXISTS
      # ======================================================

      - name: Verify output file
        shell: bash
        run: |
          test -f results/races/all_results_cleaned.csv

          echo "Updated CSV:"
          ls -lh results/races/all_results_cleaned.csv

          echo
          echo "Git status:"
          git status --short

      # ======================================================
      # COMMIT UPDATED CLEANED CSV
      # ======================================================

      - name: Commit corrected results
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add results/races/all_results_cleaned.csv

          if git diff --cached --quiet; then
            echo "No changes detected."
            echo "Nothing to commit."
            exit 0
          fi

          git commit -m "Correct historical HKJC prize money"
          git push
