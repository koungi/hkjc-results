name: HKJC Historical Results Collector

on:
  # ------------------------------------------------------------
  # MANUAL START
  # ------------------------------------------------------------

  workflow_dispatch:
    inputs:

      start_date:
        description: "Month to start from YYYY-MM-DD"
        required: true
        default: "2006-01-01"

      final_date:
        description: "Stop collecting after YYYY-MM-DD"
        required: true
        default: "2026-09-04"


  # ------------------------------------------------------------
  # RECOVERY
  # ------------------------------------------------------------
  #
  # If the chain stops or a month fails,
  # this retries from collector_state.txt.
  #
  # GitHub cron uses UTC.
  # ------------------------------------------------------------

  schedule:
    - cron: "17 * * * *"


permissions:
  contents: write
  actions: write


# --------------------------------------------------------------
# NEVER RUN TWO COLLECTORS AT THE SAME TIME
# --------------------------------------------------------------

concurrency:
  group: hkjc-historical-collector
  cancel-in-progress: false


jobs:

  collect:

    runs-on: ubuntu-latest

    steps:


      # ==========================================================
      # CHECKOUT
      #
      # lfs: true is required because the aggregate result files
      # are stored with Git LFS.
      # ==========================================================

      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          lfs: true


      # ==========================================================
      # CONFIGURE GIT LFS
      #
      # all_results.csv has exceeded GitHub's normal 100 MiB
      # per-file Git limit.
      #
      # Both aggregate CSV files are therefore stored with
      # Git Large File Storage.
      #
      # git lfs track updates .gitattributes automatically.
      # ==========================================================

      - name: Configure Git LFS
        shell: bash

        run: |

          echo "=================================================="
          echo "CONFIGURING GIT LFS"
          echo "=================================================="

          git lfs install --local

          git lfs track \
            "results/races/all_results.csv"

          git lfs track \
            "results/races/all_results_ML.csv"

          echo ""
          echo "Current .gitattributes:"
          echo "--------------------------------------------------"

          cat .gitattributes

          echo "--------------------------------------------------"


      # ==========================================================
      # PYTHON
      # ==========================================================

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"


      # ==========================================================
      # DEPENDENCIES
      # ==========================================================

      - name: Install packages
        run: |

          python -m pip install --upgrade pip

          pip install -r requirements.txt


      # ==========================================================
      # DETERMINE WHICH MONTH TO PROCESS
      # ==========================================================

      - name: Determine date range
        id: dates
        shell: bash

        run: |

          python - <<'PY'

          import calendar
          import os

          from datetime import datetime


          event_name = os.environ[
              "GITHUB_EVENT_NAME"
          ]


          # ------------------------------------------------------
          # MANUAL OR CHAINED RUN
          # ------------------------------------------------------

          if event_name == "workflow_dispatch":

              start_text = "${{ inputs.start_date }}"
              final_text = "${{ inputs.final_date }}"


          # ------------------------------------------------------
          # SCHEDULED RECOVERY
          # ------------------------------------------------------

          else:

              if os.path.exists(
                  "collector_state.txt"
              ):

                  with open(
                      "collector_state.txt",
                      "r"
                  ) as f:

                      start_text = (
                          f.read()
                          .strip()
                      )

              else:

                  start_text = "2006-01-01"


              final_text = "2026-09-04"


          # ------------------------------------------------------
          # PARSE DATES
          # ------------------------------------------------------

          start = datetime.strptime(
              start_text,
              "%Y-%m-%d"
          ).date()


          final = datetime.strptime(
              final_text,
              "%Y-%m-%d"
          ).date()


          # ------------------------------------------------------
          # ALREADY COMPLETE
          # ------------------------------------------------------

          if start > final:

              print(
                  "Collection already complete."
              )

              with open(
                  os.environ[
                      "GITHUB_OUTPUT"
                  ],
                  "a"
              ) as f:

                  f.write(
                      "finished=true\n"
                  )

              raise SystemExit(
                  0
              )


          # ------------------------------------------------------
          # END OF CURRENT MONTH
          # ------------------------------------------------------

          last_day = (
              calendar.monthrange(
                  start.year,
                  start.month
              )[1]
          )


          month_end = start.replace(
              day=last_day
          )


          if month_end > final:

              month_end = final


          print(
              f"Collecting "
              f"{start} "
              f"to "
              f"{month_end}"
          )


          # ------------------------------------------------------
          # OUTPUTS
          # ------------------------------------------------------

          with open(
              os.environ[
                  "GITHUB_OUTPUT"
              ],
              "a"
          ) as f:

              f.write(
                  "finished=false\n"
              )

              f.write(
                  f"start_date="
                  f"{start}\n"
              )

              f.write(
                  f"end_date="
                  f"{month_end}\n"
              )

              f.write(
                  f"final_date="
                  f"{final}\n"
              )

          PY


      # ==========================================================
      # RUN WHOLE-MONTH SCRAPER
      # ==========================================================

      - name: Run HKJC scraper
        id: scraper

        if: steps.dates.outputs.finished != 'true'

        # We temporarily allow the workflow to continue after
        # scraper failure so partial useful results can be committed.
        continue-on-error: true

        env:

          START_DATE: ${{ steps.dates.outputs.start_date }}
          END_DATE: ${{ steps.dates.outputs.end_date }}


          # ------------------------------------------------------
          # PHASE 1
          #
          # ALL DATE PAGES FOR THE MONTH
          # ------------------------------------------------------

          DATE_WORKERS: "16"


          # ------------------------------------------------------
          # PHASE 2
          #
          # ALL DISCOVERED RACE PAGES
          # ------------------------------------------------------

          RACE_WORKERS: "10"


          # ------------------------------------------------------
          # PHASE 3
          #
          # UNIQUE MISSING HORSES ACROSS THE WHOLE MONTH
          #
          # RECOMMENDED:
          #
          # HORSE_WORKERS: "20"
          #
          # IF YOU WANT EVERY MISSING HORSE IN THE MONTH
          # SUBMITTED AT THE SAME TIME, CHANGE THIS TO:
          #
          # HORSE_WORKERS: "0"
          # ------------------------------------------------------

          HORSE_WORKERS: "20"


          # ------------------------------------------------------
          # HTTP SETTINGS
          # ------------------------------------------------------

          REQUEST_TIMEOUT: "60"

          HORSE_REQUEST_TIMEOUT: "60"

          HTTP_RETRIES: "3"

          HTTP_BACKOFF_FACTOR: "1.0"


        run: |

          echo "=================================================="
          echo "HKJC WHOLE-MONTH CONCURRENT COLLECTION"
          echo "=================================================="

          echo "Start date: $START_DATE"
          echo "End date:   $END_DATE"

          echo ""

          echo "Date workers:  $DATE_WORKERS"
          echo "Race workers:  $RACE_WORKERS"
          echo "Horse workers: $HORSE_WORKERS"

          echo "=================================================="

          python hkjc.py


      # ==========================================================
      # ADVANCE STATE
      #
      # ONLY IF THE ENTIRE MONTH COMPLETED SUCCESSFULLY
      # ==========================================================

      - name: Update collector state

        if: >
          steps.dates.outputs.finished != 'true' &&
          steps.scraper.outcome == 'success'

        id: next

        shell: bash

        run: |

          python - <<'PY'

          import os

          from datetime import (
              datetime,
              timedelta
          )


          end = datetime.strptime(
              "${{ steps.dates.outputs.end_date }}",
              "%Y-%m-%d"
          ).date()


          final = datetime.strptime(
              "${{ steps.dates.outputs.final_date }}",
              "%Y-%m-%d"
          ).date()


          next_date = (
              end
              +
              timedelta(
                  days=1
              )
          )


          finished = (
              next_date
              >
              final
          )


          # ------------------------------------------------------
          # SAVE NEXT MONTH
          # ------------------------------------------------------

          with open(
              "collector_state.txt",
              "w"
          ) as f:

              f.write(
                  str(
                      next_date
                  )
              )


          # ------------------------------------------------------
          # OUTPUTS
          # ------------------------------------------------------

          with open(
              os.environ[
                  "GITHUB_OUTPUT"
              ],
              "a"
          ) as f:

              f.write(
                  f"next_date="
                  f"{next_date}\n"
              )

              f.write(
                  f"finished="
                  f"{'true' if finished else 'false'}"
                  f"\n"
              )


          print(
              f"Next collection starts: "
              f"{next_date}"
          )


          print(
              f"Finished: "
              f"{finished}"
          )

          PY


      # ==========================================================
      # COMMIT RESULTS
      #
      # This also runs when the scraper failed.
      #
      # Why?
      #
      # The Python script may have successfully downloaded most
      # of the month before one request ultimately failed.
      #
      # We preserve that useful work.
      #
      # collector_state.txt is NOT advanced when scraper failed,
      # so the same month will be retried.
      #
      # IMPORTANT:
      #
      # all_results.csv and all_results_ML.csv are explicitly
      # renormalized here so Git stores them as LFS pointer files
      # rather than ordinary Git blobs.
      # ==========================================================

      - name: Commit results

        if: ${{ always() && steps.dates.outputs.finished != 'true' }}

        shell: bash

        run: |

          echo "=================================================="
          echo "PREPARING RESULTS FOR COMMIT"
          echo "=================================================="


          git config \
            user.name \
            "github-actions[bot]"


          git config \
            user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"


          # ------------------------------------------------------
          # MAKE SURE LFS IS ACTIVE
          # ------------------------------------------------------

          git lfs install --local


          # ------------------------------------------------------
          # GIT LFS TRACKING RULES
          #
          # Running this again is safe and guarantees the rules
          # exist before the files are staged.
          # ------------------------------------------------------

          git lfs track \
            "results/races/all_results.csv"

          git lfs track \
            "results/races/all_results_ML.csv"


          # ------------------------------------------------------
          # ATTRIBUTES
          # ------------------------------------------------------

          if [ -f .gitattributes ]; then

            git add .gitattributes

          fi


          # ------------------------------------------------------
          # CONVERT EXISTING AGGREGATE CSV TO LFS
          #
          # This is important because all_results.csv existed
          # before its LFS tracking rule was added.
          # ------------------------------------------------------

          if [ -f results/races/all_results.csv ]; then

            git add --renormalize \
              results/races/all_results.csv

          fi


          if [ -f results/races/all_results_ML.csv ]; then

            git add --renormalize \
              results/races/all_results_ML.csv

          fi


          # ------------------------------------------------------
          # RESULTS
          # ------------------------------------------------------

          if [ -d results ]; then

            git add results/

          fi


          # ------------------------------------------------------
          # STATE
          # ------------------------------------------------------

          if [ -f collector_state.txt ]; then

            git add collector_state.txt

          fi


          # ------------------------------------------------------
          # SHOW LFS FILES
          # ------------------------------------------------------

          echo ""
          echo "=================================================="
          echo "FILES CURRENTLY TRACKED BY GIT LFS"
          echo "=================================================="

          git lfs ls-files || true

          echo "=================================================="


          # ------------------------------------------------------
          # VERIFY all_results.csv IS USING LFS
          # ------------------------------------------------------

          if [ -f results/races/all_results.csv ]; then

            echo ""
            echo "Git attributes for all_results.csv:"

            git check-attr \
              filter \
              diff \
              merge \
              -- \
              results/races/all_results.csv

          fi


          # ------------------------------------------------------
          # COMMIT ONLY WHEN SOMETHING CHANGED
          # ------------------------------------------------------

          if git diff --cached --quiet; then

            echo "No changes to commit"

          else

            echo ""
            echo "Changes staged for commit:"
            echo "--------------------------------------------------"

            git status --short

            echo "--------------------------------------------------"


            git commit \
              -m "Add HKJC results ${{ steps.dates.outputs.start_date }} to ${{ steps.dates.outputs.end_date }}"


            # ----------------------------------------------------
            # NORMAL GIT PUSH ALSO RUNS THE GIT LFS PRE-PUSH HOOK.
            #
            # The LFS object is uploaded first and GitHub receives
            # only the small pointer file in the Git commit.
            # ----------------------------------------------------

            git push

          fi


      # ==========================================================
      # START NEXT MONTH
      #
      # ONLY IF THIS MONTH SUCCEEDED
      # ==========================================================

      - name: Start next month

        if: >
          steps.dates.outputs.finished != 'true' &&
          steps.scraper.outcome == 'success' &&
          steps.next.outputs.finished != 'true'

        env:

          GH_TOKEN: ${{ github.token }}

        run: |

          echo "=================================================="
          echo "STARTING NEXT MONTH"
          echo "=================================================="


          echo \
            "Starting next month: ${{ steps.next.outputs.next_date }}"


          gh workflow run collect.yml \
            --ref "${{ github.ref_name }}" \
            -f start_date="${{ steps.next.outputs.next_date }}" \
            -f final_date="${{ steps.dates.outputs.final_date }}"


      # ==========================================================
      # COMPLETE
      # ==========================================================

      - name: Collection complete

        if: >
          steps.dates.outputs.finished != 'true' &&
          steps.scraper.outcome == 'success' &&
          steps.next.outputs.finished == 'true'

        run: |

          echo "=================================================="
          echo "HISTORICAL COLLECTION COMPLETE"
          echo "=================================================="


      # ==========================================================
      # RESTORE FAILURE STATUS
      #
      # The scraper used continue-on-error so we could commit
      # partial progress first.
      #
      # This final step makes the workflow visibly fail and,
      # importantly, collector_state.txt has NOT moved forward.
      # ==========================================================

      - name: Fail run if scraper failed

        if: steps.scraper.outcome == 'failure'

        run: |

          echo "=================================================="
          echo "SCRAPER REPORTED UNRESOLVED FAILURES"
          echo "=================================================="

          echo "Partial progress has been preserved."

          echo \
            "collector_state.txt was NOT advanced."

          echo \
            "The recovery run will retry the same month."

          exit 1
