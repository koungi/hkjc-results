name: HKJC Historical Results Collector

on:
  # Manual starting point
  workflow_dispatch:
    inputs:
      start_date:
        description: "Month to start from YYYY-MM-DD"
        required: true
        default: "2006-01-01"

      final_date:
        description: "Stop collecting after YYYY-MM-DD"
        required: true
        default: "2026-09-04"

  # Recovery trigger.
  # If the chained run stops, this can restart the process.
  schedule:
    - cron: "17 * * * *"


permissions:
  contents: write
  actions: write


# Never allow two collector runs to modify results simultaneously.
concurrency:
  group: hkjc-historical-collector
  cancel-in-progress: false


jobs:
  collect:
    runs-on: ubuntu-latest

    steps:

      # ------------------------------------------------------------
      # CHECKOUT
      # ------------------------------------------------------------

      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0


      # ------------------------------------------------------------
      # PYTHON
      # ------------------------------------------------------------

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"


      # ------------------------------------------------------------
      # DEPENDENCIES
      # ------------------------------------------------------------

      - name: Install packages
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt


      # ------------------------------------------------------------
      # DETERMINE WHICH MONTH TO COLLECT
      # ------------------------------------------------------------

      - name: Determine date range
        id: dates
        shell: bash

        run: |
          python - <<'PY'
          import os
          import calendar
          from datetime import datetime

          event_name = os.environ["GITHUB_EVENT_NAME"]

          # ------------------------------------------------------
          # MANUAL / CHAINED RUN
          # ------------------------------------------------------

          if event_name == "workflow_dispatch":

              start_text = "${{ inputs.start_date }}"
              final_text = "${{ inputs.final_date }}"

          # ------------------------------------------------------
          # SCHEDULED RECOVERY RUN
          # ------------------------------------------------------

          else:

              if not os.path.exists("collector_state.txt"):

                  start_text = "2006-01-01"

              else:

                  with open(
                      "collector_state.txt",
                      "r"
                  ) as f:

                      start_text = (
                          f.read()
                          .strip()
                      )

              final_text = "2026-09-04"


          # ------------------------------------------------------
          # PARSE DATES
          # ------------------------------------------------------

          start = datetime.strptime(
              start_text,
              "%Y-%m-%d"
          ).date()

          final = datetime.strptime(
              final_text,
              "%Y-%m-%d"
          ).date()


          # ------------------------------------------------------
          # ALREADY FINISHED
          # ------------------------------------------------------

          if start > final:

              print(
                  "Collection already complete."
              )

              with open(
                  os.environ["GITHUB_OUTPUT"],
                  "a"
              ) as f:

                  f.write(
                      "finished=true\n"
                  )

              raise SystemExit(0)


          # ------------------------------------------------------
          # END OF CURRENT MONTH
          # ------------------------------------------------------

          last_day = calendar.monthrange(
              start.year,
              start.month
          )[1]

          month_end = start.replace(
              day=last_day
          )

          if month_end > final:

              month_end = final


          print(
              f"Collecting "
              f"{start} "
              f"to "
              f"{month_end}"
          )


          # ------------------------------------------------------
          # OUTPUTS
          # ------------------------------------------------------

          with open(
              os.environ["GITHUB_OUTPUT"],
              "a"
          ) as f:

              f.write(
                  "finished=false\n"
              )

              f.write(
                  f"start_date={start}\n"
              )

              f.write(
                  f"end_date={month_end}\n"
              )

              f.write(
                  f"final_date={final}\n"
              )

          PY


      # ------------------------------------------------------------
      # RUN SCRAPER
      # ------------------------------------------------------------

      - name: Run HKJC scraper
        if: steps.dates.outputs.finished != 'true'

        env:
          START_DATE: ${{ steps.dates.outputs.start_date }}
          END_DATE: ${{ steps.dates.outputs.end_date }}

          # ------------------------------------------------------
          # HORSE CONCURRENCY
          # ------------------------------------------------------
          #
          # 0 = automatic.
          #
          # Every horse requiring a page in the current race
          # is requested concurrently.
          #
          # Example:
          # 14 horses need pages -> 14 concurrent GETs.
          #
          MAX_HORSE_WORKERS: "0"

          # No delay between horse GETs.
          #
          # This is only the delay between completed races.
          RACE_DELAY_SECONDS: "1"

          # Automatic retry for temporary HKJC errors.
          HTTP_RETRIES: "3"

          # Backoff:
          # retry delays progressively increase.
          HTTP_BACKOFF_FACTOR: "1.0"

          # Timeout for individual horse requests.
          HORSE_REQUEST_TIMEOUT: "60"

        run: |
          echo "=================================================="
          echo "HKJC COLLECTION"
          echo "=================================================="
          echo "Start date: $START_DATE"
          echo "End date:   $END_DATE"
          echo "Horse workers: AUTO - entire race field"
          echo "Race delay: $RACE_DELAY_SECONDS seconds"
          echo "HTTP retries: $HTTP_RETRIES"
          echo "=================================================="

          python hkjc.py


      # ------------------------------------------------------------
      # CALCULATE NEXT MONTH AND SAVE STATE
      # ------------------------------------------------------------

      - name: Update collector state
        if: steps.dates.outputs.finished != 'true'
        id: next
        shell: bash

        run: |
          python - <<'PY'
          import os
          from datetime import datetime, timedelta

          end = datetime.strptime(
              "${{ steps.dates.outputs.end_date }}",
              "%Y-%m-%d"
          ).date()

          final = datetime.strptime(
              "${{ steps.dates.outputs.final_date }}",
              "%Y-%m-%d"
          ).date()

          next_date = (
              end
              +
              timedelta(
                  days=1
              )
          )


          # ------------------------------------------------------
          # SAVE NEXT START DATE
          # ------------------------------------------------------

          with open(
              "collector_state.txt",
              "w"
          ) as f:

              f.write(
                  str(
                      next_date
                  )
              )


          finished = (
              next_date
              >
              final
          )


          # ------------------------------------------------------
          # OUTPUTS
          # ------------------------------------------------------

          with open(
              os.environ["GITHUB_OUTPUT"],
              "a"
          ) as f:

              f.write(
                  f"next_date="
                  f"{next_date}\n"
              )

              f.write(
                  f"finished="
                  f"{'true' if finished else 'false'}"
                  f"\n"
              )


          print(
              f"Next collection starts: "
              f"{next_date}"
          )

          print(
              f"Finished: "
              f"{finished}"
          )

          PY


      # ------------------------------------------------------------
      # COMMIT RESULTS + HORSE CACHE + STATE
      # ------------------------------------------------------------

      - name: Commit results
        if: steps.dates.outputs.finished != 'true'
        shell: bash

        run: |
          git config \
            user.name \
            "github-actions[bot]"

          git config \
            user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add results/
          git add collector_state.txt

          if git diff --cached --quiet; then

            echo "No changes to commit"

          else

            git commit \
              -m "Add HKJC results ${{ steps.dates.outputs.start_date }} to ${{ steps.dates.outputs.end_date }}"

            git push

          fi


      # ------------------------------------------------------------
      # START NEXT MONTH IMMEDIATELY
      # ------------------------------------------------------------

      - name: Start next month
        if: >
          steps.dates.outputs.finished != 'true' &&
          steps.next.outputs.finished != 'true'

        env:
          GH_TOKEN: ${{ github.token }}

        run: |
          echo "=================================================="
          echo "STARTING NEXT MONTH"
          echo "=================================================="

          echo \
            "Starting next month: ${{ steps.next.outputs.next_date }}"

          gh workflow run collect.yml \
            --ref "${{ github.ref_name }}" \
            -f start_date="${{ steps.next.outputs.next_date }}" \
            -f final_date="${{ steps.dates.outputs.final_date }}"


      # ------------------------------------------------------------
      # FINISHED
      # ------------------------------------------------------------

      - name: Collection complete
        if: steps.next.outputs.finished == 'true'

        run: |
          echo "=================================================="
          echo "HISTORICAL COLLECTION COMPLETE"
          echo "=================================================="
