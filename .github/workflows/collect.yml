name: HKJC Historical Results Collector

on:
  # Manual starting point
  workflow_dispatch:
    inputs:
      start_date:
        description: "Month to start from YYYY-MM-DD"
        required: true
        default: "2006-01-01"

      final_date:
        description: "Stop collecting after YYYY-MM-DD"
        required: true
        default: "2026-09-04"

  # Recovery trigger.
  # If a chained run fails, this can restart the process.
  schedule:
    - cron: "17 * * * *"

permissions:
  contents: write
  actions: write

# Never allow two collector runs to modify results at the same time
concurrency:
  group: hkjc-historical-collector
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install packages
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # ------------------------------------------------------------
      # Work out which month this run should collect
      # ------------------------------------------------------------

      - name: Determine date range
        id: dates
        shell: bash
        run: |
          python - <<'PY'
          import os
          import calendar
          from datetime import datetime

          event_name = os.environ["GITHUB_EVENT_NAME"]

          # Manual/chained runs receive start_date/final_date.
          # Scheduled recovery runs use collector_state.txt.
          if event_name == "workflow_dispatch":
              start_text = "${{ inputs.start_date }}"
              final_text = "${{ inputs.final_date }}"
          else:
              if not os.path.exists("collector_state.txt"):
                  start_text = "2006-01-01"
              else:
                  with open("collector_state.txt", "r") as f:
                      start_text = f.read().strip()

              # Change this if you want a different historical cutoff.
              final_text = "2026-09-04"

          start = datetime.strptime(start_text, "%Y-%m-%d").date()
          final = datetime.strptime(final_text, "%Y-%m-%d").date()

          if start > final:
              print("Collection already complete.")
              with open(os.environ["GITHUB_OUTPUT"], "a") as f:
                  f.write("finished=true\n")
              raise SystemExit(0)

          last_day = calendar.monthrange(start.year, start.month)[1]

          month_end = start.replace(day=last_day)

          if month_end > final:
              month_end = final

          print(f"Collecting {start} to {month_end}")

          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write("finished=false\n")
              f.write(f"start_date={start}\n")
              f.write(f"end_date={month_end}\n")
              f.write(f"final_date={final}\n")
          PY

      # ------------------------------------------------------------
      # Scrape one month
      # ------------------------------------------------------------

      - name: Run HKJC scraper
        if: steps.dates.outputs.finished != 'true'
        env:
          START_DATE: ${{ steps.dates.outputs.start_date }}
          END_DATE: ${{ steps.dates.outputs.end_date }}
        run: |
          echo "Collecting $START_DATE to $END_DATE"
          python hkjc.py

      # ------------------------------------------------------------
      # Calculate next month and save progress
      # ------------------------------------------------------------

      - name: Update collector state
        if: steps.dates.outputs.finished != 'true'
        id: next
        shell: bash
        run: |
          python - <<'PY'
          import os
          from datetime import datetime, timedelta

          end = datetime.strptime(
              "${{ steps.dates.outputs.end_date }}",
              "%Y-%m-%d"
          ).date()

          final = datetime.strptime(
              "${{ steps.dates.outputs.final_date }}",
              "%Y-%m-%d"
          ).date()

          next_date = end + timedelta(days=1)

          with open("collector_state.txt", "w") as f:
              f.write(str(next_date))

          finished = next_date > final

          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"next_date={next_date}\n")
              f.write(f"finished={'true' if finished else 'false'}\n")

          print(f"Next collection starts: {next_date}")
          print(f"Finished: {finished}")
          PY

      # ------------------------------------------------------------
      # Commit BOTH results and progress
      # ------------------------------------------------------------

      - name: Commit results
        if: steps.dates.outputs.finished != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add results/
          git add collector_state.txt

          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Add HKJC results ${{ steps.dates.outputs.start_date }} to ${{ steps.dates.outputs.end_date }}"
            git push
          fi

      # ------------------------------------------------------------
      # Immediately start next month
      # ------------------------------------------------------------

      - name: Start next month
        if: steps.dates.outputs.finished != 'true' && steps.next.outputs.finished != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "Starting next month: ${{ steps.next.outputs.next_date }}"

          gh workflow run collect.yml \
            --ref "${{ github.ref_name }}" \
            -f start_date="${{ steps.next.outputs.next_date }}" \
            -f final_date="${{ steps.dates.outputs.final_date }}"

      - name: Collection complete
        if: steps.next.outputs.finished == 'true'
        run: |
          echo "Historical collection complete."
