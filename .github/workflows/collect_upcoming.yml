name: HKJC Upcoming Racecard Collector

on:
  workflow_dispatch:
    inputs:
      race_date:
        description: "Race date YYYY-MM-DD"
        required: true
        default: "2026-09-06"


permissions:
  contents: write


# Prevent two upcoming collectors from writing
# the spreadsheet at the same time.
concurrency:
  group: hkjc-upcoming-racecard
  cancel-in-progress: true


jobs:

  collect:

    runs-on: ubuntu-latest

    steps:

      # ==========================================================
      # CHECKOUT
      # ==========================================================

      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0


      # ==========================================================
      # PYTHON
      # ==========================================================

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"


      # ==========================================================
      # INSTALL PACKAGES
      # ==========================================================

      - name: Install packages
        run: |
          python -m pip install --upgrade pip

          pip install \
            pandas \
            requests \
            beautifulsoup4 \
            openpyxl


      # ==========================================================
      # RUN UPCOMING RACECARD SCRAPER
      # ==========================================================

      - name: Run upcoming racecard scraper

        env:

          # ------------------------------------------------------
          # DATE ENTERED WHEN YOU CLICK "RUN WORKFLOW"
          # ------------------------------------------------------

          RACE_DATE: ${{ inputs.race_date }}


          # ------------------------------------------------------
          # RACE PAGE CONCURRENCY
          #
          # All races for the day are fetched concurrently.
          # ------------------------------------------------------

          RACE_WORKERS: "8"


          # ------------------------------------------------------
          # HORSE PROFILE CONCURRENCY
          #
          # Used to obtain:
          #
          # age
          # sex
          # season stakes
          # total stakes
          # sire
          # dam
          # ------------------------------------------------------

          HORSE_WORKERS: "20"


          # ------------------------------------------------------
          # HTTP SETTINGS
          # ------------------------------------------------------

          REQUEST_TIMEOUT: "60"

          HTTP_RETRIES: "4"

          HTTP_BACKOFF_FACTOR: "1.5"


        run: |
          echo "=================================================="
          echo "HKJC UPCOMING RACECARD COLLECTOR"
          echo "=================================================="

          echo "Race date: $RACE_DATE"
          echo "Race workers:  $RACE_WORKERS"
          echo "Horse workers: $HORSE_WORKERS"

          echo "=================================================="

          # Python file is inside the scripts folder.
          python scripts/upcoming.py


      # ==========================================================
      # SHOW GENERATED FILES
      # ==========================================================

      - name: Check generated files
        run: |
          echo "Generated race files:"

          ls -lah results/races/ || true


      # ==========================================================
      # COMMIT UPCOMING FILES
      # ==========================================================

      - name: Commit upcoming race spreadsheet
        shell: bash

        run: |
          git config \
            user.name \
            "github-actions[bot]"

          git config \
            user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"


          # Add the two upcoming race files if they exist.

          if [ -f results/races/upcoming_races.xlsx ]; then
            git add results/races/upcoming_races.xlsx
          fi

          if [ -f results/races/upcoming_races.csv ]; then
            git add results/races/upcoming_races.csv
          fi


          # Only commit when the scraper actually changed something.

          if git diff --cached --quiet; then

            echo "No upcoming racecard changes to commit"

          else

            git commit \
              -m "Update HKJC upcoming races ${{ inputs.race_date }}"

            git push

          fi
