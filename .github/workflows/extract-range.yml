name: Extract results date range

on:
  workflow_dispatch:
    inputs:
      start_date:
        description: "Start date (YYYY-MM-DD)"
        required: true
        default: "2006-01-01"

      end_date:
        description: "End date (YYYY-MM-DD)"
        required: true
        default: "2015-12-31"

permissions:
  contents: write

concurrency:
  group: extract-results-date-range
  cancel-in-progress: false

jobs:
  extract-results:
    runs-on: ubuntu-latest

    steps:
      # ======================================================
      # CHECKOUT REPOSITORY
      #
      # LFS is still required here because the SOURCE file
      # all_results_cleaned.csv is stored using Git LFS.
      # ======================================================

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true
          fetch-depth: 0

      # ======================================================
      # DOWNLOAD SOURCE LFS FILE
      # ======================================================

      - name: Pull Git LFS source files
        run: |
          git lfs install
          git lfs pull

      # ======================================================
      # VERIFY FILES
      # ======================================================

      - name: Verify source file
        run: |
          test -f results/races/all_results_cleaned.csv
          test -f scripts/extract_range.py

          echo "Source file:"
          ls -lh results/races/all_results_cleaned.csv

          echo
          echo "Extraction script:"
          ls -lh scripts/extract_range.py

      # ======================================================
      # SET UP PYTHON
      # ======================================================

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # ======================================================
      # INSTALL DEPENDENCIES
      # ======================================================

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "pandas>=2.2,<3"

      # ======================================================
      # SHOW SELECTED RANGE
      # ======================================================

      - name: Show selected date range
        run: |
          echo "START_DATE=${{ inputs.start_date }}"
          echo "END_DATE=${{ inputs.end_date }}"

      # ======================================================
      # EXTRACT DATE RANGE
      # ======================================================

      - name: Extract selected date range
        env:
          START_DATE: ${{ inputs.start_date }}
          END_DATE: ${{ inputs.end_date }}
        run: |
          python scripts/extract_range.py

      # ======================================================
      # CONFIRM SOURCE FILE WAS NOT MODIFIED
      # ======================================================

      - name: Confirm source CSV was not modified
        shell: bash
        run: |
          if ! git diff --quiet -- results/races/all_results_cleaned.csv; then
            echo "ERROR:"
            echo "results/races/all_results_cleaned.csv was modified."
            exit 1
          fi

          echo "Confirmed:"
          echo "all_results_cleaned.csv was not modified."

      # ======================================================
      # VERIFY OUTPUT EXISTS
      # ======================================================

      - name: Verify output file
        run: |
          test -f results/races/all_results_date_range.csv

          echo "Output file:"
          ls -lh results/races/all_results_date_range.csv

      # ======================================================
      # MAKE SURE OUTPUT IS NOT LFS TRACKED
      # ======================================================

      - name: Verify output is not Git LFS
        shell: bash
        run: |
          ATTRIBUTE="$(git check-attr filter -- results/races/all_results_date_range.csv | awk '{print $3}')"

          if [ "$ATTRIBUTE" = "lfs" ]; then
            echo "ERROR:"
            echo "all_results_date_range.csv is currently covered by a Git LFS rule."
            exit 1
          fi

          echo "Confirmed:"
          echo "all_results_date_range.csv will be stored as a normal Git file."

      # ======================================================
      # SHOW STATUS
      # ======================================================

      - name: Show Git status
        run: |
          git status --short
          ls -lh results/races/all_results_date_range.csv

      # ======================================================
      # COMMIT OUTPUT AS NORMAL GIT FILE
      # ======================================================

      - name: Commit extracted dataset
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add results/races/all_results_date_range.csv

          if git diff --cached --quiet; then
            echo "No changes detected."
            echo "Nothing to commit."
            exit 0
          fi

          git commit -m "Extract race results ${{ inputs.start_date }} to ${{ inputs.end_date }}"
          git push
