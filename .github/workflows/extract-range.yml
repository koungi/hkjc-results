name: Extract results date range

on:
  workflow_dispatch:
    inputs:
      start_date:
        description: "Start date (YYYY-MM-DD)"
        required: true
        default: "2006-01-01"

      end_date:
        description: "End date (YYYY-MM-DD)"
        required: true
        default: "2015-12-31"

permissions:
  contents: write

concurrency:
  group: extract-results-date-range
  cancel-in-progress: false

jobs:
  extract-results:
    runs-on: ubuntu-latest

    steps:
      # ======================================================
      # CHECKOUT REPOSITORY
      #
      # The source all_results_cleaned.csv is stored using
      # Git LFS, so LFS support is enabled here.
      # ======================================================

      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          lfs: true
          fetch-depth: 0

      # ======================================================
      # DOWNLOAD THE ACTUAL SOURCE LFS FILE
      # ======================================================

      - name: Pull Git LFS source files
        run: |
          git lfs install
          git lfs pull

      # ======================================================
      # VERIFY REQUIRED FILES
      # ======================================================

      - name: Verify required files
        shell: bash
        run: |
          test -f results/races/all_results_cleaned.csv
          test -f scripts/extract_range.py

          echo "Source CSV:"
          ls -lh results/races/all_results_cleaned.csv

          echo
          echo "Python script:"
          ls -lh scripts/extract_range.py

      # ======================================================
      # IMPORTANT
      #
      # all_results_date_range.csv must NOT use Git LFS.
      #
      # Your repository already has an LFS rule which matches
      # this CSV, so explicitly override that rule.
      #
      # The exception is added AFTER the existing LFS rules.
      # ======================================================

      - name: Exclude date range CSV from Git LFS
        shell: bash
        run: |
          EXCEPTION="results/races/all_results_date_range.csv -filter -diff -merge text"

          touch .gitattributes

          if grep -Fxq "$EXCEPTION" .gitattributes; then
            echo "Git LFS exception already exists."
          else
            echo "$EXCEPTION" >> .gitattributes
            echo "Added Git LFS exception:"
            echo "$EXCEPTION"
          fi

          echo
          echo ".gitattributes:"
          cat .gitattributes

      # ======================================================
      # VERIFY THE EXCEPTION IS ACTIVE
      # ======================================================

      - name: Verify output is excluded from Git LFS
        shell: bash
        run: |
          echo "Git attributes for output:"
          git check-attr filter diff merge text -- results/races/all_results_date_range.csv

          ATTRIBUTE="$(git check-attr filter -- results/races/all_results_date_range.csv | awk '{print $3}')"

          if [ "$ATTRIBUTE" = "lfs" ]; then
            echo
            echo "ERROR:"
            echo "results/races/all_results_date_range.csv is still covered by Git LFS."
            exit 1
          fi

          echo
          echo "Confirmed:"
          echo "all_results_date_range.csv will be stored as a normal Git file."

      # ======================================================
      # SET UP PYTHON
      # ======================================================

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # ======================================================
      # INSTALL DEPENDENCIES
      # ======================================================

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "pandas>=2.2,<3"

      # ======================================================
      # DISPLAY THE SELECTED DATE RANGE
      # ======================================================

      - name: Show selected date range
        shell: bash
        run: |
          echo "START_DATE=${{ inputs.start_date }}"
          echo "END_DATE=${{ inputs.end_date }}"

      # ======================================================
      # RUN DATE RANGE EXTRACTION
      #
      # Python reads:
      #
      # results/races/all_results_cleaned.csv
      #
      # and creates:
      #
      # results/races/all_results_date_range.csv
      #
      # START_DATE and END_DATE are inclusive.
      # ======================================================

      - name: Extract selected date range
        env:
          START_DATE: ${{ inputs.start_date }}
          END_DATE: ${{ inputs.end_date }}
        run: |
          python scripts/extract_range.py

      # ======================================================
      # VERIFY SOURCE FILE WAS NOT MODIFIED
      # ======================================================

      - name: Confirm source CSV was not modified
        shell: bash
        run: |
          if ! git diff --quiet -- results/races/all_results_cleaned.csv; then
            echo "ERROR:"
            echo "results/races/all_results_cleaned.csv was modified."
            exit 1
          fi

          echo "Confirmed:"
          echo "all_results_cleaned.csv was not modified."

      # ======================================================
      # VERIFY OUTPUT EXISTS
      # ======================================================

      - name: Verify output file
        shell: bash
        run: |
          test -f results/races/all_results_date_range.csv

          echo "Output CSV:"
          ls -lh results/races/all_results_date_range.csv

      # ======================================================
      # DOUBLE-CHECK OUTPUT IS NOT LFS
      # ======================================================

      - name: Final Git LFS check
        shell: bash
        run: |
          ATTRIBUTE="$(git check-attr filter -- results/races/all_results_date_range.csv | awk '{print $3}')"

          echo "filter attribute: $ATTRIBUTE"

          if [ "$ATTRIBUTE" = "lfs" ]; then
            echo
            echo "ERROR:"
            echo "Output CSV is still configured for Git LFS."
            exit 1
          fi

          echo
          echo "Confirmed:"
          echo "Output CSV is a normal Git file."

      # ======================================================
      # CHECK NORMAL GIT FILE SIZE
      #
      # GitHub blocks regular Git files larger than 100 MiB.
      # ======================================================

      - name: Check output file size
        shell: bash
        run: |
          FILE="results/races/all_results_date_range.csv"

          SIZE_BYTES=$(stat -c%s "$FILE")
          MAX_BYTES=104857600

          echo "Output size:"
          ls -lh "$FILE"

          echo
          echo "Exact size: $SIZE_BYTES bytes"

          if [ "$SIZE_BYTES" -gt "$MAX_BYTES" ]; then
            echo
            echo "ERROR:"
            echo "The generated CSV is larger than 100 MiB."
            echo "GitHub will not accept it as a normal Git file."
            echo "Choose a smaller date range."
            exit 1
          fi

          echo
          echo "Output is below the 100 MiB GitHub limit."

      # ======================================================
      # SHOW STATUS BEFORE COMMIT
      # ======================================================

      - name: Show Git status
        shell: bash
        run: |
          echo "Git status:"
          git status --short

          echo
          echo "Output file:"
          ls -lh results/races/all_results_date_range.csv

          echo
          echo "Output Git attributes:"
          git check-attr filter diff merge text -- results/races/all_results_date_range.csv

      # ======================================================
      # COMMIT
      #
      # Commit:
      #
      # 1. .gitattributes exception
      # 2. all_results_date_range.csv as a NORMAL Git file
      #
      # Do NOT run git lfs track on the output.
      # ======================================================

      - name: Commit extracted dataset
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add .gitattributes
          git add results/races/all_results_date_range.csv

          echo "Staged files:"
          git diff --cached --name-only

          if git diff --cached --quiet; then
            echo "No changes detected."
            echo "Nothing to commit."
            exit 0
          fi

          git commit -m "Extract race results ${{ inputs.start_date }} to ${{ inputs.end_date }}"
          git push
