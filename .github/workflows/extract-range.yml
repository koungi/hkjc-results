name: Extract results date range

on:
  workflow_dispatch:
    inputs:
      start_date:
        description: "Start date (YYYY-MM-DD)"
        required: true
        default: "2006-01-01"

      end_date:
        description: "End date (YYYY-MM-DD)"
        required: true
        default: "2015-12-31"

permissions:
  contents: write

concurrency:
  group: extract-results-date-range
  cancel-in-progress: false

jobs:
  extract-results:
    runs-on: ubuntu-latest

    steps:
      # ======================================================
      # CHECKOUT REPOSITORY
      #
      # Node.js 24 compatible action.
      #
      # LFS is required because the SOURCE:
      # results/races/all_results_cleaned.csv
      # is stored in Git LFS.
      # ======================================================

      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          lfs: true
          fetch-depth: 0

      # ======================================================
      # DOWNLOAD SOURCE LFS CONTENT
      # ======================================================

      - name: Pull Git LFS source files
        run: |
          git lfs install
          git lfs pull

      # ======================================================
      # VERIFY REQUIRED FILES
      # ======================================================

      - name: Verify source file
        run: |
          test -f results/races/all_results_cleaned.csv
          test -f scripts/extract_range.py

          echo "Source file:"
          ls -lh results/races/all_results_cleaned.csv

          echo
          echo "Python script:"
          ls -lh scripts/extract_range.py

      # ======================================================
      # SET UP PYTHON
      #
      # Node.js 24 compatible action.
      # ======================================================

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # ======================================================
      # INSTALL PYTHON DEPENDENCIES
      # ======================================================

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "pandas>=2.2,<3"

      # ======================================================
      # DISPLAY DATE RANGE
      # ======================================================

      - name: Show selected date range
        run: |
          echo "START_DATE=${{ inputs.start_date }}"
          echo "END_DATE=${{ inputs.end_date }}"

      # ======================================================
      # RUN EXTRACTION
      #
      # Input:
      # results/races/all_results_cleaned.csv
      #
      # Output:
      # results/races/all_results_date_range.csv
      # ======================================================

      - name: Extract selected date range
        env:
          START_DATE: ${{ inputs.start_date }}
          END_DATE: ${{ inputs.end_date }}
        run: |
          python scripts/extract_range.py

      # ======================================================
      # VERIFY SOURCE WAS NOT MODIFIED
      # ======================================================

      - name: Confirm source CSV was not modified
        shell: bash
        run: |
          if ! git diff --quiet -- results/races/all_results_cleaned.csv; then
            echo "ERROR:"
            echo "results/races/all_results_cleaned.csv was modified."
            exit 1
          fi

          echo "Confirmed:"
          echo "all_results_cleaned.csv was not modified."

      # ======================================================
      # VERIFY OUTPUT EXISTS
      # ======================================================

      - name: Verify output file
        run: |
          test -f results/races/all_results_date_range.csv

          echo "Output file:"
          ls -lh results/races/all_results_date_range.csv

      # ======================================================
      # IMPORTANT:
      # OUTPUT MUST NOT BE STORED IN GIT LFS
      # ======================================================

      - name: Verify output is not Git LFS
        shell: bash
        run: |
          ATTRIBUTE="$(git check-attr filter -- results/races/all_results_date_range.csv | awk '{print $3}')"

          if [ "$ATTRIBUTE" = "lfs" ]; then
            echo "ERROR:"
            echo "results/races/all_results_date_range.csv is covered by a Git LFS rule."
            echo "The output must be stored as a normal Git file."
            exit 1
          fi

          echo "Confirmed:"
          echo "all_results_date_range.csv is NOT tracked by Git LFS."

      # ======================================================
      # VERIFY OUTPUT IS UNDER GITHUB'S NORMAL 100 MB LIMIT
      # ======================================================

      - name: Check output file size
        shell: bash
        run: |
          FILE="results/races/all_results_date_range.csv"

          SIZE_BYTES=$(stat -c%s "$FILE")
          MAX_BYTES=104857600

          echo "Output size: $SIZE_BYTES bytes"

          if [ "$SIZE_BYTES" -ge "$MAX_BYTES" ]; then
            echo "ERROR:"
            echo "Output CSV is 100 MB or larger."
            echo "GitHub will not accept it as a normal Git file."
            exit 1
          fi

          echo "Output is below 100 MB."

      # ======================================================
      # SHOW GIT STATUS
      # ======================================================

      - name: Show Git status
        run: |
          git status --short

          echo
          echo "Output:"
          ls -lh results/races/all_results_date_range.csv

      # ======================================================
      # COMMIT OUTPUT AS A NORMAL GIT FILE
      # ======================================================

      - name: Commit extracted dataset
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add results/races/all_results_date_range.csv

          if git diff --cached --quiet; then
            echo "No changes detected."
            echo "Nothing to commit."
            exit 0
          fi

          git commit -m "Extract race results ${{ inputs.start_date }} to ${{ inputs.end_date }}"
          git push
