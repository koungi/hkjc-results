name: First pass ML race cleaning

on:
  workflow_dispatch:

  push:
    paths:
      - "scripts/first_pass_ML.py"
      - "results/races/all_results_date_range.csv"
      - ".github/workflows/first-pass-ml.yml"
      - ".gitattributes"

permissions:
  contents: write

concurrency:
  group: first-pass-ml-race-cleaning
  cancel-in-progress: false

jobs:
  clean-races:
    runs-on: ubuntu-latest

    steps:
      # ======================================================
      # CHECKOUT REPOSITORY
      # ======================================================

      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # ======================================================
      # VERIFY INPUT FILES
      # ======================================================

      - name: Verify input files
        shell: bash
        run: |
          test -f results/races/all_results_date_range.csv
          test -f scripts/first_pass_ML.py

          echo "Source CSV:"
          ls -lh results/races/all_results_date_range.csv

          echo
          echo "Python script:"
          ls -lh scripts/first_pass_ML.py

      # ======================================================
      # SET UP PYTHON
      # ======================================================

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # ======================================================
      # INSTALL DEPENDENCIES
      # ======================================================

      - name: Install dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install "pandas>=2.2,<3"

      # ======================================================
      # FORCE OUTPUT FILE TO NORMAL GIT
      #
      # This adds an exception to .gitattributes so that:
      #
      # results/races/all_results_with_races_removed.csv
      #
      # is NOT stored with Git LFS.
      # ======================================================

      - name: Configure output as normal Git file
        shell: bash
        run: |
          OUTPUT_RULE='results/races/all_results_with_races_removed.csv -filter -diff -merge text'

          touch .gitattributes

          if ! grep -Fxq "$OUTPUT_RULE" .gitattributes; then
            echo >> .gitattributes
            echo "# First-pass ML generated output - normal Git file" >> .gitattributes
            echo "$OUTPUT_RULE" >> .gitattributes
          fi

          echo "Current .gitattributes:"
          cat .gitattributes

          echo
          echo "Git attributes for output file:"
          git check-attr filter diff merge text -- results/races/all_results_with_races_removed.csv

      # ======================================================
      # RUN FIRST-PASS ML CLEANING
      #
      # Reads:
      # results/races/all_results_date_range.csv
      #
      # Creates:
      # results/races/all_results_with_races_removed.csv
      # ======================================================

      - name: Run first pass ML cleaning
        shell: bash
        run: |
          python scripts/first_pass_ML.py

      # ======================================================
      # VERIFY OUTPUT
      # ======================================================

      - name: Verify output file
        shell: bash
        run: |
          test -f results/races/all_results_with_races_removed.csv

          echo "Generated CSV:"
          ls -lh results/races/all_results_with_races_removed.csv

          echo
          echo "Line count:"
          wc -l results/races/all_results_with_races_removed.csv

      # ======================================================
      # REMOVE ANY OLD LFS-TRACKED INDEX ENTRY
      #
      # Safe even if the file was previously deleted.
      # ======================================================

      - name: Reset output Git tracking
        shell: bash
        run: |
          git rm --cached --ignore-unmatch results/races/all_results_with_races_removed.csv || true

          echo
          echo "Re-adding output as normal Git file."

          git add .gitattributes
          git add results/races/all_results_with_races_removed.csv

      # ======================================================
      # VERIFY OUTPUT IS NOT GIT LFS
      # ======================================================

      - name: Verify output is normal Git
        shell: bash
        run: |
          ATTRIBUTE="$(git check-attr filter -- results/races/all_results_with_races_removed.csv | awk '{print $3}')"

          echo "Filter attribute: $ATTRIBUTE"

          if [ "$ATTRIBUTE" = "lfs" ]; then
            echo
            echo "ERROR:"
            echo "results/races/all_results_with_races_removed.csv"
            echo "is still configured for Git LFS."
            echo
            echo ".gitattributes contents:"
            cat .gitattributes
            exit 1
          fi

          echo
          echo "Confirmed:"
          echo "Output CSV is configured as a normal Git file."

      # ======================================================
      # VERIFY FILE IS NOT AN LFS POINTER
      # ======================================================

      - name: Verify output is not an LFS pointer
        shell: bash
        run: |
          if head -n 1 results/races/all_results_with_races_removed.csv | grep -q "version https://git-lfs.github.com/spec/v1"; then
            echo "ERROR:"
            echo "Output file is an LFS pointer instead of the real CSV."
            exit 1
          fi

          echo "Confirmed:"
          echo "Output contains the actual CSV data."

      # ======================================================
      # SHOW GIT STATUS
      # ======================================================

      - name: Show Git status
        shell: bash
        run: |
          echo "Git status:"
          git status --short

          echo
          echo "Output size:"
          ls -lh results/races/all_results_with_races_removed.csv

          echo
          echo "Staged files:"
          git diff --cached --name-status

      # ======================================================
      # COMMIT GENERATED CSV AS NORMAL GIT FILE
      # ======================================================

      - name: Commit cleaned race dataset
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git diff --cached --quiet; then
            echo "No changes detected."
            echo "Nothing to commit."
            exit 0
          fi

          git commit -m "Generate first-pass ML race dataset"
          git push

      # ======================================================
      # COMPLETE
      # ======================================================

      - name: Complete
        shell: bash
        run: |
          echo "SUCCESS"
          echo
          echo "Input:"
          echo "results/races/all_results_date_range.csv"
          echo
          echo "Generated:"
          echo "results/races/all_results_with_races_removed.csv"
          echo
          echo "The generated file is stored using normal Git, not Git LFS."
