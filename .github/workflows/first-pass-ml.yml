name: First pass ML race cleaning

on:
  workflow_dispatch:

  push:
    paths:
      - "scripts/first_pass_ML.py"
      - "results/races/all_results_date_range.csv"
      - ".github/workflows/first-pass-ml.yml"

permissions:
  contents: write

concurrency:
  group: first-pass-ml-race-cleaning
  cancel-in-progress: false

jobs:
  clean-races:
    runs-on: ubuntu-latest

    steps:
      # ======================================================
      # CHECKOUT REPOSITORY
      # ======================================================

      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # ======================================================
      # VERIFY INPUT FILES
      # ======================================================

      - name: Verify input files
        shell: bash
        run: |
          test -f results/races/all_results_date_range.csv
          test -f scripts/first_pass_ML.py

          echo "Source CSV:"
          ls -lh results/races/all_results_date_range.csv

          echo
          echo "Python script:"
          ls -lh scripts/first_pass_ML.py

      # ======================================================
      # SET UP PYTHON
      # ======================================================

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # ======================================================
      # INSTALL DEPENDENCIES
      # ======================================================

      - name: Install dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install "pandas>=2.2,<3"

      # ======================================================
      # RUN FIRST-PASS ML CLEANING
      #
      # Reads:
      # results/races/all_results_date_range.csv
      #
      # Creates:
      # results/races/all_results_with_races_removed.csv
      # ======================================================

      - name: Run first pass ML cleaning
        shell: bash
        run: |
          python scripts/first_pass_ML.py

      # ======================================================
      # VERIFY OUTPUT
      # ======================================================

      - name: Verify output file
        shell: bash
        run: |
          test -f results/races/all_results_with_races_removed.csv

          echo "Generated CSV:"
          ls -lh results/races/all_results_with_races_removed.csv

          echo
          echo "Line count:"
          wc -l results/races/all_results_with_races_removed.csv

      # ======================================================
      # MAKE SURE OUTPUT IS NOT USING GIT LFS
      # ======================================================

      - name: Verify output is normal Git
        shell: bash
        run: |
          ATTRIBUTE="$(git check-attr filter -- results/races/all_results_with_races_removed.csv | awk '{print $3}')"

          if [ "$ATTRIBUTE" = "lfs" ]; then
            echo "ERROR:"
            echo "results/races/all_results_with_races_removed.csv"
            echo "is currently configured for Git LFS."
            echo
            echo "Remove its Git LFS rule from .gitattributes."
            exit 1
          fi

          echo "Confirmed:"
          echo "Output CSV will be stored as a normal Git file."

      # ======================================================
      # SHOW GIT STATUS
      # ======================================================

      - name: Show Git status
        shell: bash
        run: |
          echo "Git status:"
          git status --short

          echo
          echo "Output size:"
          ls -lh results/races/all_results_with_races_removed.csv

      # ======================================================
      # COMMIT GENERATED CSV AS NORMAL GIT FILE
      # ======================================================

      - name: Commit cleaned race dataset
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add results/races/all_results_with_races_removed.csv

          if git diff --cached --quiet; then
            echo "No changes detected."
            echo "Nothing to commit."
            exit 0
          fi

          git commit -m "Generate first-pass ML race dataset"
          git push

      # ======================================================
      # COMPLETE
      # ======================================================

      - name: Complete
        shell: bash
        run: |
          echo "SUCCESS"
          echo
          echo "Generated:"
          echo "results/races/all_results_with_races_removed.csv"
          echo
          echo "The file is stored using normal Git, not Git LFS."
